name: Playwright Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Check USER_SID
        env:
          USER_SID: ${{ secrets.USER_SID }}
        run: |
          if [ -z "$USER_SID" ]; then
            echo "USER_SID is empty"
            exit 1
          else
            echo "USER_SID is configured"
          fi

      - name: Run Playwright tests
        env:
          USER_SID: ${{ secrets.USER_SID }}
        run: npx playwright test